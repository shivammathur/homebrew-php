name: Publish prebuilt PHP security bottles
run-name: Promote private security build ${{ inputs.private_run_id }}

on:
  workflow_dispatch:
    inputs:
      private_run_id:
        description: Successful security-build.yml run in homebrew-php-security
        required: true
      target_branch:
        description: Public branch to update
        default: main
        required: true
      publish:
        description: Upload to public GHCR and push the formula/bottle commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-bottle-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'shivammathur/homebrew-php'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: write
    defaults:
      run:
        shell: bash
    env:
      PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          core: true
          cask: false
          stable: false

      - name: Fetch the successful private build
        id: private-build
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_RUN_ID" =~ ^[0-9]+$ ]]
          git check-ref-format "refs/heads/$TARGET_BRANCH"
          test -n "$GH_TOKEN"
          test "$(gh api repos/shivammathur/homebrew-php-security --jq .private)" = true
          gh api "repos/shivammathur/homebrew-php-security/actions/runs/$PRIVATE_RUN_ID" > "$RUNNER_TEMP/private-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'private-run.json').read_text())
          assert run['conclusion'] == 'success' and run['status'] == 'completed', 'Private build did not succeed'
          assert run['path'] == '.github/workflows/security-build.yml', 'Wrong private workflow'
          assert run['repository']['full_name'] == 'shivammathur/homebrew-php-security'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={run['head_sha']}\n")
          PY
          mkdir "$RUNNER_TEMP/private-bottles"
          gh release download "security-build-$PRIVATE_RUN_ID" \
            --repo shivammathur/homebrew-php-security --dir "$RUNNER_TEMP/private-bottles"

      - name: Prepare the public tap
        id: public-tap
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          set -euo pipefail
          cp .github/scripts/security_bottles.py "$RUNNER_TEMP/security_bottles.py"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          git checkout -B security-promotion FETCH_HEAD
          git config user.name BrewTestBot
          git config user.email 1589480+BrewTestBot@users.noreply.github.com
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify announced sources and promote bottle metadata
        id: promote
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          PRIVATE_COMMIT: ${{ steps.private-build.outputs.commit }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/security_bottles.py" promote \
            --input "$RUNNER_TEMP/private-bottles" --output "$RUNNER_TEMP/public-bottles" \
            --tap "$PWD" --run-id "$PRIVATE_RUN_ID" --build-commit "$PRIVATE_COMMIT"

      - name: Validate bottle merge and public formulae
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/public-bottles"
          brew ruby -e 'require "sbom"; require "json_schemer"; schema = JSONSchemer.schema(SBOM.schema); ARGV.each { |path| errors = schema.validate(JSON.parse(File.read(path))).to_a; abort "Invalid promoted SBOM: #{path}" unless errors.empty? }' -- ./*.spdx.json
          brew bottle --merge --write --no-commit --root-url=https://ghcr.io/v2/shivammathur/php ./*.bottle.json
          python3 - <<'PY'
          import json, subprocess
          names = ['shivammathur/php/' + name for name in json.load(open('promotion.json'))['formulae']]
          subprocess.run(['brew', 'style', *names], check=True)
          subprocess.run(['brew', 'audit', '--skip-style', *names], check=True)
          PY

      - name: Save verified public candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-security-bottles-${{ inputs.private_run_id }}
          path: |
            ${{ runner.temp }}/public-bottles/*.bottle*.tar.gz
            ${{ runner.temp }}/public-bottles/*.bottle.json
            ${{ runner.temp }}/public-bottles/promotion.json
          if-no-files-found: error

      - name: Publish and commit bottles
        if: inputs.publish
        env:
          PUBLIC_TAP_PATH: ${{ steps.homebrew.outputs.repository-path }}
          PUBLIC_BASE: ${{ steps.public-tap.outputs.base }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C "$PUBLIC_TAP_PATH" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$PUBLIC_BASE"
          cd "$RUNNER_TEMP/public-bottles"
          brew pr-upload --root-url=https://ghcr.io/v2/shivammathur/php
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.load(open('promotion.json'))
          for bottle in report['bottles']:
              bottle.pop('payload_sha256')
          path = Path(os.environ['PUBLIC_TAP_PATH']) / '.github/security-promotions' / (os.environ['PRIVATE_RUN_ID'] + '.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
          git -C "$PUBLIC_TAP_PATH" add ".github/security-promotions/$PRIVATE_RUN_ID.json"
          git -C "$PUBLIC_TAP_PATH" commit -m "Publish prebuilt PHP security bottles [skip-build]"

      - name: Save promotion commits for recovery
        if: inputs.publish && !cancelled() && steps.promote.outcome == 'success'
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          PUBLIC_BASE: ${{ steps.public-tap.outputs.base }}
        run: git bundle create "$RUNNER_TEMP/security-promotion.bundle" "$PUBLIC_BASE..HEAD"

      - name: Save recovery bundle
        if: inputs.publish && !cancelled() && steps.promote.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-promotion-commits-${{ inputs.private_run_id }}
          path: ${{ runner.temp }}/security-promotion.bundle
          if-no-files-found: error

      - name: Push public commits
        if: inputs.publish
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$TARGET_BRANCH"
          if [[ "$TARGET_BRANCH" == main ]]; then
            gh workflow run sync-default-branches.yml --repo shivammathur/homebrew-php
          fi

